[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  esp-idf/esp-camera
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DCAMERA_MODEL_XIAO_ESP32S3

[platformio]
description = ESP32-S3 Sense camera + Edge Impulse starter for luxury-car detection
